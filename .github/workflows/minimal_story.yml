name: Minimal Story

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: '測試模式（跑完極簡故事，不上傳 YouTube）'
        required: false
        default: false
        type: boolean
      enable_youtube_upload:
        description: '是否上傳至 YouTube（預設開啟；測試模式仍不會上傳）'
        required: false
        default: true
        type: boolean

jobs:
  minimal-story:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Traditional Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies and Playwright
        run: |
          pip install feedparser pillow matplotlib opencc-python-reimplemented google-api-python-client google-auth-oauthlib playwright
          playwright install chromium --with-deps

      - name: Build minimal story
        env:
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
          ENABLE_YOUTUBE_UPLOAD: ${{ inputs.enable_youtube_upload }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_minimal_story.py

      - name: Reset CHATGPT.txt after deep-dive production
        if: ${{ success() && !inputs.test_mode && inputs.enable_youtube_upload == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_FILE=""
          if [ -f CHATGPT.TXT ]; then
            TARGET_FILE="CHATGPT.TXT"
          elif [ -f CHATGPT.txt ]; then
            TARGET_FILE="CHATGPT.txt"
          fi

          if [ -n "$TARGET_FILE" ]; then
            # 必須先備份原始研究內容，確認備份成功後才允許重置來源檔。
            BACKUP_DIR="backups/chatgpt"
            BACKUP_FILE="$BACKUP_DIR/$(basename "$TARGET_FILE").\${GITHUB_RUN_ID:-manual}.\${GITHUB_RUN_ATTEMPT:-1}.bak"
            mkdir -p "$BACKUP_DIR"
            cp -p "$TARGET_FILE" "$BACKUP_FILE"
            if ! cmp -s "$TARGET_FILE" "$BACKUP_FILE"; then
              echo "CHATGPT 原檔備份驗證失敗；禁止重置或刪除原檔。"
              exit 1
            fi
            git add "$BACKUP_FILE"
            echo "已完成 CHATGPT 原檔備份：$BACKUP_FILE"

            printf '%s\\n' '# 若要使用 ChatGPT 深度討論內容製片，請將完整文章貼於此檔案並執行 Minimal Story workflow；若無實質內容則自動抓取當日即時新聞。' > "$TARGET_FILE"
            git add "$TARGET_FILE"
          fi

 then
            echo "CHATGPT.txt 無實質變動，略過重置提交。"
          else
            git commit -m "chore(minimal): reset CHATGPT.txt after deep-dive production [skip ci]"

            # Rendering can take 20+ minutes. Other workflows or manual commits may
            # update main while this job is rendering, so rebase and retry safely.
            PUSHED=false
            for attempt in 1 2 3; do
              echo "同步遠端 main（第 ${attempt}/3 次）..."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "遠端變更與 CHATGPT 重置提交發生衝突；保留遠端內容並停止，不強制覆蓋。"
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                PUSHED=true
                break
              fi
              echo "推送期間 main 再次更新，準備重新同步..."
            done

            if [ "$PUSHED" != "true" ]; then
              echo "重試 3 次後仍無法推送 CHATGPT 重置提交。"
              exit 1
            fi
          fi

      - name: Publish preview to GitHub Releases
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=()
          [ -f story_main.mp4 ] && FILES+=(story_main.mp4)
          [ -f story_short.mp4 ] && FILES+=(story_short.mp4)
          [ -f story_thumb.jpg ] && FILES+=(story_thumb.jpg)
          [ -f story_metadata.txt ] && FILES+=(story_metadata.txt)
          [ -f story_broll_manifest.json ] && FILES+=(story_broll_manifest.json)
          [ -f publish_bundle.json ] && FILES+=(publish_bundle.json)

          if [ ${#FILES[@]} -gt 0 ]; then
            echo "正在發布極簡故事預覽至 latest-preview Release..."
            gh release view latest-preview >/dev/null 2>&1 || gh release create latest-preview --title "Latest Preview" --notes "Automated video preview"
            gh release upload latest-preview "${FILES[@]}" --clobber
          else
            echo "找不到預覽影音檔案，略過 Release 發布。"
          fi

      - name: Upload preview artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: minimal-story-preview-${{ github.run_number }}
          path: |
            story_main.mp4
            story_short.mp4
            story_thumb.jpg
            story_metadata.txt
            story_broll_manifest.json
          retention-days: 5