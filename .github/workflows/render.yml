name: Render and Upload Podcast

on:
  schedule:
    # 原 cron 0 22 * * * 是 UTC 22:00，換算台灣時間為當日 06:00 才開始渲染。
    # 抓取、1080p 合成與上傳還要數小時，成品常拖到台灣時間上午 11:00 之後。
    # 改為 UTC 19:15，即台灣時間 03:15 啟動，預留緩衝，目標在 06:00 前發布完成。
    - cron: '15 19 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '測試模式（完整跑完影片與資料生成，但跳過 YouTube 上傳改存下載預覽）'
        required: false
        default: false
        type: boolean
      enable_youtube_upload:
        description: '是否上傳至 YouTube（預設關閉，僅發布至 GitHub Releases latest-preview）'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Traditional Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies and Playwright
        run: |
          pip install feedparser pillow matplotlib opencc-python-reimplemented google-api-python-client google-auth-oauthlib playwright
          playwright install chromium --with-deps

      - name: Run render and upload script
        env:
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
          # 手動執行時嚴格遵守 input，false 不得被 Repository Variable 的 true 覆蓋；排程仍沿用 Repository Variable。
          ENABLE_YOUTUBE_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_youtube_upload || (github.event_name != 'workflow_dispatch' && vars.ENABLE_YOUTUBE_UPLOAD == 'true') }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_and_upload.py

      - name: Publish preview to GitHub Releases
        if: ${{ success() || failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 確保產出標準預覽檔名
          [ -f output.mp4 ] && [ ! -f daily_main.mp4 ] && cp output.mp4 daily_main.mp4
          [ -f short.mp4 ] && [ ! -f daily_short.mp4 ] && cp short.mp4 daily_short.mp4
          [ -f thumb.jpg ] && [ ! -f daily_thumb.jpg ] && cp thumb.jpg daily_thumb.jpg

          FILES=()
          [ -f daily_main.mp4 ] && FILES+=(daily_main.mp4)
          [ -f daily_short.mp4 ] && FILES+=(daily_short.mp4)
          [ -f daily_thumb.jpg ] && FILES+=(daily_thumb.jpg)
          [ -f thumb.jpg ] && [ ! -f daily_thumb.jpg ] && FILES+=(thumb.jpg)
          [ -f transcript.txt ] && FILES+=(transcript.txt)
          [ -f youtube_metadata.txt ] && FILES+=(youtube_metadata.txt)
          [ -f publish_bundle.json ] && FILES+=(publish_bundle.json)

          if [ ${#FILES[@]} -gt 0 ]; then
            echo "正在發布預覽至 latest-preview Release..."
            gh release view latest-preview >/dev/null 2>&1 || gh release create latest-preview --title "Latest Preview" --notes "Automated video preview"
            gh release upload latest-preview "${FILES[@]}" --clobber
          else
            echo "找不到預覽影音檔案，略過 Release 發布。"
          fi

      - name: Upload test preview artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: podcast-preview-${{ github.run_number }}
          path: |
            *.mp4
            *.jpg
            *.png
            *.txt
            !avatar.png
            !info.mp4
            !cat_vtober.mp4
            !dor_vtober.mp4
          retention-days: 5

      - name: Commit editorial learning history
        # 正式渲染即保存選題、主軸與品質警告；即使只產生 Release 預覽、沒有上傳 YouTube 也要累積歷史。
        if: ${{ inputs.test_mode != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain history_db)" ]; then
            git add history_db
            git commit -m "chore: update editorial learning history"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Commit and push DCA ledger
        # DCA 帳本仍只在正式 YouTube 發布時更新，預覽不寫回帳本。
        if: ${{ inputs.test_mode != true && (github.event_name != 'workflow_dispatch' || inputs.enable_youtube_upload == true) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain dca_portfolio.json)" ]; then
            git add dca_portfolio.json
            git commit -m "chore: update BTC DCA portfolio ledger"
            git pull --rebase origin main
            git push origin main
          fi
