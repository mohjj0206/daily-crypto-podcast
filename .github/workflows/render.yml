name: Render and Upload Podcast

on:
  repository_dispatch:
    types: [render-podcast]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg and Traditional Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          pip install pillow opencc-python-reimplemented google-api-python-client google-auth-oauthlib

      - name: Run render and upload script
        env:
          AUDIO_URL: ${{ github.event.client_payload.audio_url }}
          VIDEO_TITLE: ${{ github.event.client_payload.video_title }}
          VIDEO_DESC: ${{ github.event.client_payload.video_desc }}
          SRT_BASE64: ${{ github.event.client_payload.srt_base64 }}
          SLIDE1_DATA: ${{ github.event.client_payload.slide1_data }}
          SLIDE2_DATA: ${{ github.event.client_payload.slide2_data }}
          SLIDE3_DATA: ${{ github.event.client_payload.slide3_data }}
          TODAY_STR: ${{ github.event.client_payload.today_str }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_and_upload.py
