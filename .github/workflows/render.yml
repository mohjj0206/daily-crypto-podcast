name: Render and Upload Podcast

on:
  schedule:
    # 原 cron 0 22 * * * 是 UTC 22:00，換算台灣時間為當日 06:00 才開始渲染。
    # 抓取、1080p 合成與上傳還要數小時，成品常拖到台灣時間上午 11:00 之後。
    # 改為 UTC 19:15，即台灣時間 03:15 啟動，預留緩衝，目標在 06:00 前發布完成。
    - cron: '15 19 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '測試模式（完整跑完影片與資料生成，但跳過 YouTube 上傳改存下載預覽）'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Traditional Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies and Playwright
        run: |
          pip install feedparser pillow matplotlib opencc-python-reimplemented google-api-python-client google-auth-oauthlib playwright
          playwright install chromium --with-deps

      - name: Run render and upload script
        env:
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_and_upload.py

      - name: Upload test preview artifacts
        if: ${{ inputs.test_mode == true || hashFiles('UPLOAD_FAILED.flag') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: podcast-preview-${{ github.run_number }}
          path: |
            *.mp4
            *.jpg
            *.png
            youtube_metadata.txt
            !avatar.png
            !info.mp4
            !cat_vtober.mp4
            !dor_vtober.mp4
          retention-days: 5

      - name: Commit and push DCA ledger
        if: ${{ inputs.test_mode != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain dca_portfolio.json history_db)" ]; then
            git add dca_portfolio.json history_db
            git commit -m "chore: update BTC DCA portfolio ledger and learning history"
            git push
          fi
