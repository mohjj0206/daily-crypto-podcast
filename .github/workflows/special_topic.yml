name: Evergreen Tutorial

on:
  schedule:
    # 每週六台灣時間 09:00。UTC 01:00，與每日 03:15 晨報錯開。
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '測試模式（跑完教學片，不上傳、不回寫進度）'
        required: false
        default: false
        type: boolean
      reuse_script:
        description: '重用 cache_last_tutorial_script.json，不呼叫 Gemini'
        required: false
        default: false
        type: boolean
      target_ep_id:
        description: '指定課號，例如 EP01。空白則自動選下一堂'
        required: false
        default: ''
        type: string
      custom_topic:
        description: '手動加更題目。有填則優先於課號'
        required: false
        default: ''
        type: string

jobs:
  tutorial:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Traditional Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies and Playwright
        run: |
          pip install feedparser pillow matplotlib opencc-python-reimplemented google-api-python-client google-auth-oauthlib playwright
          playwright install chromium --with-deps

      - name: Render evergreen tutorial
        env:
          MODE: evergreen
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
          REUSE_SCRIPT: ${{ inputs.reuse_script || 'false' }}
          TARGET_EP_ID: ${{ inputs.target_ep_id || '' }}
          CUSTOM_TOPIC: ${{ inputs.custom_topic || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_special_topic.py

      - name: Upload test preview artifacts
        if: ${{ always() && (inputs.test_mode == true || hashFiles('UPLOAD_FAILED.flag') != '') }}
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-preview-${{ github.run_number }}
          path: |
            tutorial_main.mp4
            tutorial_short.mp4
            thumb_tutorial.jpg
            tutorial_chart.png
            youtube_metadata.txt
          retention-days: 5

      - name: Commit tutorial progress
        if: ${{ inputs.test_mode != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain evergreen_progress.json knowledge_base/evergreen_curriculum.json)" ]; then
            git add evergreen_progress.json knowledge_base/evergreen_curriculum.json
            git commit -m "chore: update evergreen tutorial progress"
            git checkout -- .
            git clean -fd
            git pull --rebase origin main
            git push origin main
          fi
