<!DOCTYPE html>
<script>
    async function loadDashboard() {
      try {
        const ledgerRes = await fetch('./dca_portfolio.json?t=' + Date.now());
        const ledger = await ledgerRes.json();

        let liveUsd = Number(ledger.current_btc_usd || 0);
        let liveTwdRate = Number(ledger.current_twd_rate || 32.5);

        const records = ledger.records || [];
        let sumTwd = 0, sumBtc = 0;
        const labels = [], costSeries = [], valSeries = [];
        const tbody = document.getElementById('ledger-body');
        if (tbody) tbody.innerHTML = '';

        records.forEach(item => {
          const date = item.date || '-';
          const twd = Number(item.twd_invested || 10000);
          const usdPrice = Number(item.btc_price_usd || 0);
          const twdPrice = Number(item.btc_price_twd || 0);
          const btc = Number(item.btc_bought || 0);
          sumTwd += twd;
          sumBtc += btc;

          labels.push(date);
          costSeries.push(sumTwd);
          valSeries.push(Math.round(sumBtc * twdPrice));

          if (tbody) {
            tbody.innerHTML += `<tr><td>${date}</td><td>NT$ ${twd.toLocaleString()}</td><td>$${usdPrice.toLocaleString()}</td><td>${btc.toFixed(8)} BTC</td></tr>`;
          }
        });

        const totalTwd = Number(ledger.total_twd || sumTwd);
        const totalBtc = Number(ledger.total_btc || sumBtc);
        const avgUsd = Number(ledger.avg_buy_price_usd || 0);
        const currentValTwd = Math.round(totalBtc * liveUsd * liveTwdRate);
        const pnlTwd = currentValTwd - totalTwd;
        const pnlPct = totalTwd > 0 ? ((pnlTwd / totalTwd) * 100).toFixed(2) : '0.00';

        labels.push('今日即時');
        costSeries.push(totalTwd);
        valSeries.push(currentValTwd);

        const totalTwdEl = document.getElementById('total-twd');
        if (totalTwdEl) totalTwdEl.innerText = `NT$ ${totalTwd.toLocaleString()}`;
        const totalBtcEl = document.getElementById('total-btc');
        if (totalBtcEl) totalBtcEl.innerText = `${totalBtc.toFixed(8)} BTC`;
        const avgUsdEl = document.getElementById('avg-usd');
        if (avgUsdEl) avgUsdEl.innerText = `$${avgUsd.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        const pnlEl = document.getElementById('pnl-twd');
        if (pnlEl) {
          pnlEl.innerHTML = `NT$ ${currentValTwd.toLocaleString()}<br><span style="font-size:1rem" class="${pnlTwd >= 0 ? 'pos' : 'neg'}">${pnlTwd >= 0 ? '+' : ''}NT$ ${pnlTwd.toLocaleString()} (${pnlPct}%)</span>`;
        }

        const chartEl = document.getElementById('dcaChart');
        if (chartEl && typeof Chart !== 'undefined') new Chart(chartEl, {
          type: 'line',
          data: {
            labels,
            datasets: [
              { label: '總資產市值 (TWD)', data: valSeries, borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.15)', fill: true, tension: 0.3 },
              { label: '累計投入本金 (TWD)', data: costSeries, borderColor: '#38bdf8', borderDash: [5, 5], fill: false, tension: 0.1 }
            ]
          },
          options: {
            responsive: true,
            plugins: { legend: { labels: { color: '#f1f5f9' } } },
            scales: {
              x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(148,163,184,0.1)' } },
              y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(148,163,184,0.1)' } }
            }
          }
        });
      } catch (e) {
        const totalTwdEl = document.getElementById('total-twd');
        if (totalTwdEl) totalTwdEl.innerText = '資料載入異常：' + e.message;
      }
    }
    loadDashboard();
  </script>
